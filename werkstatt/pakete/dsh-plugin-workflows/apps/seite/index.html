<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Apps · PROMPTHEUS Werkstatt</title>
<link rel="stylesheet" href="/promptheus-apps/seite/app.css">
</head>
<body>
<div id="uebersicht" class="uebersicht" aria-labelledby="titel">
  <header class="kopf">
    <div class="kopf-zeile">
      <h1 id="titel">Meine Apps</h1>
      <div class="kopf-werkzeuge">
        <label class="suche"><span class="ico" data-i="lupe"></span><input id="suche" type="search" placeholder="Apps suchen" aria-label="Apps suchen"></label>
        <select id="sortierung" aria-label="Sortierung">
          <option value="benutzt">Zuletzt benutzt</option>
          <option value="name">Name</option>
          <option value="fehler">Fehler zuerst</option>
        </select>
        <label class="haken"><input type="checkbox" id="leereZeigen"> leere zeigen</label>
        <button type="button" class="knopf" id="ausVorlage"><span class="ico" data-i="plus"></span>Aus Vorlage</button>
        <button type="button" class="knopf haupt" id="neueApp" title="Schritt für Schritt eine eigene App bauen"><span class="ico" data-i="werkzeug"></span>Neue App</button>
        <button type="button" class="knopf rund" id="zu" aria-label="Schliessen" title="Schliessen (Esc)"><span class="ico" data-i="x"></span></button>
      </div>
    </div>
    <div class="zahlen" id="zahlen" aria-live="polite"></div>
  </header>
  <main class="brett" id="brett" aria-label="Apps nach Kategorien"></main>
</div>

<div id="appSeite" class="app-seite" hidden role="dialog" aria-modal="true" aria-labelledby="appName"></div>
<div id="dialog" class="dialog" hidden role="dialog" aria-modal="true"></div>
<div id="hinweis" class="hinweis-toast" role="status" aria-live="polite"></div>
<script src="/promptheus-apps/seite/grund.js"></script>
<script src="/promptheus-apps/seite/app.js"></script>
</body>
</html>
