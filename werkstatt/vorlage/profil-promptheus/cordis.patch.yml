# PROMPTHEUS Werkstatt — eigene Schicht über den Bündeln.
#
# Diese Datei gehört PROMPTHEUS, nicht dem Harness. Sie liegt außerhalb von
# D:\zarbot\tenants\admin\scripts\deepseek-harness und wird deshalb bei einer
# Aufwertung des Harness nicht überschrieben.
#
# Aufbau: eine Liste von Zeilen. `id` trifft eine Zeile aus einem Bündel und
# ERSETZT deren `config` (vollständig — jede Zeile muss alle ihre Schlüssel
# erneut nennen); `insert` hängt neue Zeilen an. Die Reihenfolge in dieser Datei
# ist die Ladereihenfolge — das Sprachpaket muss NACH dem Sprachkern stehen,
# damit `de` schon angemeldet ist.
#
# Siehe: PROMPTHEUS\vps\Pläne\40_Werkstatt\Deepseek-Dashboard-Maske-Plan.md

# ── Zugriffsstufen auf Deutsch ──────────────────────────────────────────────
#
# Die drei Namen („Read only", „Workspace Write", „Full access") stehen NICHT
# in der Sprachebene des Harness — sie sind Konfiguration. Der Client liest sie
# aus `meta.description` der Zeile (`permission-presets`, siehe
# ui-permission-presets/src/client/settings-store.ts) und schreibt sie mit
# `displayPermissionPreset` zu einer Beschriftung um.
#
# Weil hier Konfiguration steht, die uns gehört, lassen sich die Stufen auf
# Deutsch setzen, ohne ein einziges Stück Harness-Quelltext anzufassen.
# `approval` und `sandbox` bleiben unverändert — nur die Beschriftung ist neu.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Nur lesen
        description: Nur lesen
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Workspace schreiben
        description: Workspace schreiben
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Vollzugriff
        description: Vollzugriff
    # Seit 03.10.2026: Vorgabe „Workspace schreiben“ mit Rückfrage, nicht
    # Vollzugriff ohne Rückfrage. Die Werkstatt ist für Kinder und Jugendliche.
    # Achtung: Die Sandbox unter Windows begrenzt nur das SCHREIBEN; lesen kann
    # der Agent weiterhin überall. Deshalb gehen alle Modellanfragen über die
    # Schutzschicht (werkzeuge/schutz/), die maskiert und protokolliert.
    defaultPreset: workspace-write

# ── Die Maske selbst ────────────────────────────────────────────────────────
- insert:
    # Runde 0: Profil, Paketgerüst, Bauweg.
    # Runde 1: Bildmarke, Wortmarke, Palette, Mäander.
    # Runde 2: deutsche Texte (im Paket), Zugriffsstufen (oben).
    - id: promptheus-maske
      name: '@promptheus/dsh-client-ui-promptheus'
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
