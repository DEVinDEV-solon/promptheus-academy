<!-- PROMPTHEUS — Mäander (laufender Schlüssel).

     Das Grundornament der Marke. Kachel 32×32, kachelt waagerecht als
     durchlaufendes Band und senkrecht als Gewebe.

     Es wird NIE als sichtbare Linie benutzt, sondern immer als Maske: die
     Fläche darunter gibt die Farbe, die Deckkraft steht in
     `--ornament-staerke`. Deshalb ist hier alles weiss — was zählt, ist
     Deckung, nicht Farbe.

     Aufbau: eine durchgehende Grundlinie, daran hängt die Spirale. Ohne die
     durchgehende Linie bricht das Muster an jeder Kachelkante ab. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="square">
    <path d="M0 28 H32"/>
    <path d="M6 28 V6 H26 V22 H12 V16 H20"/>
  </g>
</svg>
