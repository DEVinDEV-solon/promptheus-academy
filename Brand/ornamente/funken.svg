<!-- PROMPTHEUS — Funkenfeld.

     Das leiseste der drei Muster: verstreute Vierstrahler, unregelmässig
     gesetzt. Kachel 96×96.

     Es gehört auf grosse leere Flächen — den Torhintergrund, den Kopf einer
     Seite. Der Mäander ist dort zu regelmässig und wird zur Tapete; die
     Funken bleiben Atmosphäre.

     Unregelmässig bedeutet hier: von Hand gesetzt, nicht gerastert. Ein
     Raster erkennt das Auge sofort als Muster, und dann sieht die Fläche
     billig aus. -->
