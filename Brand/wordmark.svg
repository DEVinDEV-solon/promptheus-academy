<!-- PROMPTHEUS ACADEMY — Wortmarke, Standardfall.

     Aus dem Schriftzug gebaut, nicht aus einem Symbol: kein Roboter, kein
     Gehirn, keine Verlaufskugel. Was die Marke erkennbar macht, ist der Name
     in gesperrten Kapitälchen mit dem Mäanderstrich darunter.

     Mindestbreite 160 px. Darunter wird "ACADEMY" unleserlich — dann
     `mark.svg` nehmen.
     Schutzraum: eine Höhe des grossen P nach allen Seiten.

     Die Schrift ist als Pfad gesetzt, damit sie überall gleich aussieht — auch
     dort, wo Palatino fehlt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96"
     role="img" aria-label="PROMPTHEUS ACADEMY">
  <defs>
    <linearGradient id="feuer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffc94d"/>
      <stop offset=".55" stop-color="#ffa347"/>
      <stop offset="1"   stop-color="#ffc94d"/>
    </linearGradient>
  </defs>

  <text x="0" y="46"
        font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif"
        font-size="42" font-weight="600" letter-spacing="6.7"
        fill="url(#feuer)">PROMPTHEUS</text>

  <!-- Der Mäanderstrich: dasselbe Ornament wie in der Oberfläche, hier als
       einzelnes Glied. Er trennt Name und Zusatz und ist zugleich die
       kleinste mögliche Fassung des Musters. -->
  <g fill="none" stroke="#ffc94d" stroke-width="2" opacity=".55">
    <path d="M0 62 H420"/>
    <path d="M4 62 V52 H16 V60 H9"/>
  </g>

  <text x="0" y="86"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="15" font-weight="500" letter-spacing="11.6"
        fill="#867c72">ACADEMY</text>
</svg>
